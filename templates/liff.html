<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>記帳</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div id="loading" class="loading-screen">
    <div class="loading-spinner"></div>
    <p>載入中...</p>
  </div>

  <div id="app" style="display:none">
    <div class="tab-panels">

      <!-- 新增記帳 -->
      <div class="tab-panel active" id="tab-add">
        <h2>新增記帳</h2>
        <form id="add-form">
          <div class="form-group">
            <label>項目</label>
            <input type="text" id="item" placeholder="例：早餐" required>
          </div>
          <div class="form-group">
            <label>金額</label>
            <input type="number" id="amount" placeholder="0" min="1" required>
          </div>
          <div class="form-group">
            <label>收/支</label>
            <div class="seg-control">
              <button type="button" class="seg-btn active" data-value="支出">支出</button>
              <button type="button" class="seg-btn" data-value="收入">收入</button>
            </div>
            <input type="hidden" id="record-type-hidden" value="支出">
          </div>
          <div class="form-group">
            <label>日期</label>
            <input type="date" id="date">
          </div>
          <button type="submit" class="btn-primary btn-block">記帳</button>
        </form>
        <div id="add-msg" class="msg-area"></div>
      </div>

      <!-- 查詢 -->
      <div class="tab-panel" id="tab-records" style="display:none">
        <div class="month-bar">
          <input type="month" id="records-month">
          <button class="btn-sm" onclick="loadRecords()">查詢</button>
        </div>
        <div id="summary-card" class="card"></div>
        <div id="records-list"></div>
      </div>

      <!-- 算錢 -->
      <div class="tab-panel" id="tab-settlement" style="display:none">
        <div class="month-bar">
          <input type="month" id="settlement-month">
          <button class="btn-sm" onclick="loadSettlement()">計算</button>
        </div>
        <div id="settlement-result"></div>

        <div class="section-divider"></div>
        <h3>補款登記</h3>
        <form id="payment-form">
          <div class="form-group">
            <label>補給誰</label>
            <input type="text" id="payment-to" placeholder="收款人姓名">
          </div>
          <div class="form-group">
            <label>金額</label>
            <input type="number" id="payment-amount" placeholder="0" min="1">
          </div>
          <button type="submit" class="btn-primary btn-block">登記補款</button>
        </form>
        <div id="payment-msg" class="msg-area"></div>
      </div>

      <!-- 成員 -->
      <div class="tab-panel" id="tab-members" style="display:none">
        <h2>群組成員</h2>
        <div id="members-list"></div>

        <div class="section-divider"></div>
        <h3>新增手動成員</h3>
        <form id="add-member-form">
          <div class="form-group input-btn-row">
            <input type="text" id="member-name" placeholder="成員名稱">
            <button type="submit" class="btn-primary">新增</button>
          </div>
        </form>
        <div id="member-msg" class="msg-area"></div>
      </div>

    </div><!-- end tab-panels -->

    <nav class="tab-bar">
      <button class="tab-btn active" data-tab="add">
        <span class="tab-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        </span>
        <span class="tab-label">新增</span>
      </button>
      <button class="tab-btn" data-tab="records">
        <span class="tab-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
        <span class="tab-label">查詢</span>
      </button>
      <button class="tab-btn" data-tab="settlement">
        <span class="tab-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="8.01" y2="10"/><line x1="12" y1="10" x2="12.01" y2="10"/><line x1="16" y1="10" x2="16.01" y2="10"/><line x1="8" y1="14" x2="8.01" y2="14"/><line x1="12" y1="14" x2="12.01" y2="14"/><line x1="16" y1="14" x2="16.01" y2="14"/><line x1="8" y1="18" x2="12" y2="18"/><line x1="16" y1="18" x2="16.01" y2="18"/></svg>
        </span>
        <span class="tab-label">算錢</span>
      </button>
      <button class="tab-btn" data-tab="members">
        <span class="tab-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </span>
        <span class="tab-label">成員</span>
      </button>
      <div class="tab-bar-sep"></div>
      <button class="theme-toggle" id="theme-toggle" aria-label="切換主題"></button>
    </nav>
  </div><!-- end app -->

  <!-- Merge modal -->
  <div id="merge-modal" class="modal" style="display:none">
    <div class="modal-overlay" onclick="closeMergeModal()"></div>
    <div class="modal-content">
      <h3>合併成員</h3>
      <p class="merge-desc">將手動成員 <strong id="merge-manual-name"></strong> 合併為以下真實 LINE 成員後，手動成員將被移除。</p>
      <div id="merge-line-list" class="merge-list"></div>
      <div class="modal-btns" style="margin-top:16px">
        <button type="button" class="btn-secondary" onclick="closeMergeModal()">取消</button>
      </div>
    </div>
  </div>

  <!-- Edit modal -->
  <div id="modal" class="modal" style="display:none">
    <div class="modal-overlay" onclick="closeModal()"></div>
    <div class="modal-content">
      <h3>修改記帳</h3>
      <form id="edit-form">
        <input type="hidden" id="edit-id">
        <input type="hidden" id="edit-chat-id">
        <div class="form-group">
          <label>項目</label>
          <input type="text" id="edit-item" required>
        </div>
        <div class="form-group">
          <label>金額</label>
          <input type="number" id="edit-amount" min="1" required>
        </div>
        <div class="form-group">
          <label>收/支</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="edit_type" value="支出"> 支出
            </label>
            <label class="radio-label">
              <input type="radio" name="edit_type" value="收入"> 收入
            </label>
          </div>
        </div>
        <div class="form-group">
          <label>付款人</label>
          <select id="edit-user-id"></select>
        </div>
        <div class="form-group">
          <label>日期</label>
          <input type="date" id="edit-date">
        </div>
        <div class="modal-btns">
          <button type="submit" class="btn-primary">儲存</button>
          <button type="button" class="btn-secondary" onclick="closeModal()">取消</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast"></div>
  <script>const LIFF_ID = "{{ liff_id }}";</script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
